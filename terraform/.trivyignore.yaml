misconfigurations:
  - id: AVD-AWS-0132
    paths:
      - bootstrap/main.tf
    statement: The lab state bucket uses S3-managed encryption to avoid customer-managed KMS key cost.
  - id: AVD-AWS-0040
    paths:
      - environments/lab/eks.tf
    statement: The lab enables the public EKS endpoint but restricts access to an explicit administrator CIDR.
  - id: AVD-AWS-0104
    paths:
      - environments/lab/eks.tf
    statement: Lab nodes use public subnets without NAT; their default egress supports node and image access.
  - id: AVD-AWS-0164
    paths:
      - environments/lab/network.tf
    statement: Public IP assignment is intentional for the cost-conscious lab subnets, which have no NAT gateway.

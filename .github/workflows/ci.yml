name: CI Security Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_REF: secure-gitops-app:ci-${{ github.sha }}

jobs:
  quality:
    name: Lint and Test
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run Ruff
        run: ruff check app tests

      - name: Run pytest
        run: pytest -q

  source-security:
    name: Source Security
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Scan repository for secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: "v0.72.0"
          scan-type: fs
          scan-ref: "."
          scanners: secret
          format: table
          exit-code: "1"
          hide-progress: true

      - name: Scan Dockerfile for misconfigurations
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: "."
          scanners: misconfig
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
          hide-progress: true
          skip-setup-trivy: true

  container-security:
    name: Container Security
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs:
      - quality
      - source-security

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Build secure container image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          pull: true
          tags: ${{ env.IMAGE_REF }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate configured non-root user
        shell: bash
        run: |
          set -euo pipefail

          configured_user="$(
            docker image inspect \
              --format '{{.Config.User}}' \
              "$IMAGE_REF"
          )"

          echo "Configured user: $configured_user"

          if [ "$configured_user" != "10001:10001" ]; then
            echo "FAIL: Image is not configured to use UID:GID 10001:10001"
            exit 1
          fi

          echo "PASS: Image is configured with a non-root user"

      - name: Run container security and health tests
        shell: bash
        run: |
          set -euo pipefail

          docker run \
            --detach \
            --name secure-gitops-app-ci \
            --publish 127.0.0.1:8000:8000 \
            "$IMAGE_REF"

          cleanup() {
            docker rm -f secure-gitops-app-ci >/dev/null 2>&1 || true
          }

          trap cleanup EXIT

          echo "Waiting for Docker health check..."

          health_status="starting"

          for attempt in $(seq 1 45); do
            health_status="$(
              docker inspect \
                --format '{{.State.Health.Status}}' \
                secure-gitops-app-ci
            )"

            echo "Attempt ${attempt}: ${health_status}"

            if [ "$health_status" = "healthy" ]; then
              break
            fi

            if [ "$health_status" = "unhealthy" ]; then
              docker logs secure-gitops-app-ci
              exit 1
            fi

            sleep 2
          done

          if [ "$health_status" != "healthy" ]; then
            echo "FAIL: Container did not become healthy"
            docker logs secure-gitops-app-ci
            exit 1
          fi

          runtime_uid="$(
            docker exec secure-gitops-app-ci id -u
          )"

          echo "Runtime UID: $runtime_uid"

          if [ "$runtime_uid" != "10001" ]; then
            echo "FAIL: Container is not running as UID 10001"
            exit 1
          fi

          echo
          echo "=== LIVENESS ==="
          curl --fail --silent --show-error \
            http://127.0.0.1:8000/health |
            python3 -m json.tool

          echo
          echo "=== READINESS ==="
          curl --fail --silent --show-error \
            http://127.0.0.1:8000/ready |
            python3 -m json.tool

          echo
          echo "PASS: Container is healthy and running as non-root"

      - name: Scan image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: "v0.72.0"
          scan-type: image
          image-ref: ${{ env.IMAGE_REF }}
          scanners: vuln
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          hide-progress: true

      - name: Scan container image for secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_REF }}
          scanners: secret
          format: table
          exit-code: "1"
          hide-progress: true
          skip-setup-trivy: true

      - name: Write pipeline summary
        if: success()
        run: |
          {
            echo "## CI Security Pipeline Passed"
            echo
            echo "- Ruff linting passed"
            echo "- Pytest passed"
            echo "- Repository secret scan passed"
            echo "- Dockerfile security scan passed"
            echo "- Container image built successfully"
            echo "- Non-root runtime validation passed"
            echo "- Liveness and readiness checks passed"
            echo "- HIGH/CRITICAL vulnerability gate passed"
            echo "- Image secret scan passed"
          } >> "$GITHUB_STEP_SUMMARY"

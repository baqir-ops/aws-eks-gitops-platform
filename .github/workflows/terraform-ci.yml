name: Terraform CI

on:
  pull_request:
    paths:
      - 'terraform/**'
  push:
    branches:
      - main
    paths:
      - 'terraform/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Terraform Infrastructure
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c57009a6460db321f5bc0268d011c778 # v3.1.2
        with:
          terraform_version: "1.9.0"

      - name: Check Terraform Formatting
        run: terraform fmt -check -recursive terraform/

      - name: Initialize and Validate Terraform
        run: |
          cd terraform
          terraform init -backend=false
          terraform validate

      - name: Security & Misconfiguration Scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: "v0.72.0"
          scan-type: config
          scan-ref: "terraform"
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
          hide-progress: true

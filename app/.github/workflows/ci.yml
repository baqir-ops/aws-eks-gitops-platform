name: CI Security Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_REF: secure-gitops-app:ci-${{ github.sha }}

jobs:
  quality:
    name: Lint and Test
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run Ruff
        run: ruff check app tests

      - name: Run pytest
        run: pytest -q

  source-security:
    name: Source Security
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Scan repository for secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: "v0.72.0"
          scan-type: fs
          scan-ref: "."
          scanners: secret
          format: table
          exit-code: "1"
          hide-progress: true

      - name: Scan Dockerfile for misconfigurations
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: "."
          scanners: misconfig
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
          hide-progress: true
          skip-setup-trivy: true

  container-security:
    name: Container Security
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs:
      - quality
      - source-security

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Build secure container image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          pull: true
          tags: ${{ env.IMAGE_REF }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate configured non-root user
        shell: bash
        run: |
          set -euo pipefail

          configured_user="$(
            docker image inspect \
              --format '{{.Config.User}}' \
              "$IMAGE_REF"
          )"

          echo "Configured user: $configured_user"

          if [ "$configured_user" != "10001:10001" ]; then
            echo "FAIL: Image is not configured to use UID:GID 10001:10001"
            exit 1
          fi

          echo "PASS: Image is configured with a non-root user"

      - name: Run container security and health tests
        shell: bash
        run: |
          set -euo pipefail

          docker run \
            --detach \
            --name secure-gitops-app-ci \
            --publish 127.0.0.1:8000:8000 \
            "$IMAGE_REF"

          cleanup() {
            docker rm -f secure-gitops-app-ci >/dev/null 2>&1 || true
          }

          trap cleanup EXIT

          echo "Waiting for Docker health check..."

          health_status="starting"

          for attempt in $(seq 1 45); do
            health_status="$(
              docker inspect \
                --format '{{.State.Health.Status}}' \
                secure-gitops-app-ci
            )"

            echo "Attempt ${attempt}: ${health_status}"

            if [ "$health_status" = "healthy" ]; then
              break
            fi

            if [ "$health_status" = "unhealthy" ]; then
              docker logs secure-gitops-app-ci
              exit 1
            fi

            sleep 2
          done

          if [ "$health_status" != "healthy" ]; then
            echo "FAIL: Container did not become healthy"
            docker logs secure-gitops-app-ci
            exit 1
          fi

          runtime_uid="$(
            docker exec secure-gitops-app-ci id -u
          )"

          echo "Runtime UID: $runtime_uid"

          if [ "$runtime_uid" != "10001" ]; then
            echo "FAIL: Container is not running as UID 10001"
            exit 1
          fi

          echo
          echo "=== LIVENESS ==="
          curl --fail --silent --show-error \
            http://127.0.0.1:8000/health |
            python3 -m json.tool

          echo
          echo "=== READINESS ==="
          curl --fail --silent --show-error \
            http://127.0.0.1:8000/ready |
            python3 -m json.tool

          echo
          echo "PASS: Container is healthy and running as non-root"

      - name: Scan image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: "v0.72.0"
          scan-type: image
          image-ref: ${{ env.IMAGE_REF }}
          scanners: vuln
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          hide-progress: true

      - name: Scan container image for secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_REF }}
          scanners: secret
          format: table
          exit-code: "1"
          hide-progress: true
          skip-setup-trivy: true

      - name: Write pipeline summary
        if: success()
        run: |
          {
            echo "## CI Security Pipeline Passed"
            echo
            echo "- Ruff linting passed"
            echo "- Pytest passed"
            echo "- Repository secret scan passed"
            echo "- Dockerfile security scan passed"
            echo "- Container image built successfully"
            echo "- Non-root runtime validation passed"
            echo "- Liveness and readiness checks passed"
            echo "- HIGH/CRITICAL vulnerability gate passed"
            echo "- Image secret scan passed"
          } >> "$GITHUB_STEP_SUMMARY"

  publish-ecr:
    name: Publish Immutable Image to ECR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - container-security
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      IMAGE_TAG: sha-${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Configure temporary AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-${{ github.run_id }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true
          unset-current-credentials: true

      - name: Verify assumed AWS identity
        run: |
          set -euo pipefail

          aws sts get-caller-identity \
            --query 'Arn' \
            --output text

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6
        with:
          mask-password: true

      - name: Calculate immutable image reference
        id: image-metadata
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          set -euo pipefail

          image_uri="${REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          echo "image_uri=${image_uri}" >> "$GITHUB_OUTPUT"
          echo "Image reference: ${image_uri}"

      - name: Check whether immutable tag already exists
        id: existing-image
        run: |
          set -euo pipefail

          if aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --region "$AWS_REGION" \
            --image-ids imageTag="$IMAGE_TAG" \
            >/dev/null 2>&1
          then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Image tag already exists; publication will be skipped."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Image tag does not exist and will be published."
          fi

      - name: Build publication image
        if: steps.existing-image.outputs.exists == 'false'
        env:
          IMAGE_URI: ${{ steps.image-metadata.outputs.image_uri }}
        run: |
          set -euo pipefail

          docker build \
            --pull \
            --tag "$IMAGE_URI" \
            .

      - name: Scan publication image
        if: steps.existing-image.outputs.exists == 'false'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: "v0.72.0"
          scan-type: image
          image-ref: ${{ steps.image-metadata.outputs.image_uri }}
          scanners: vuln,secret
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          hide-progress: true

      - name: Push immutable image
        if: steps.existing-image.outputs.exists == 'false'
        env:
          IMAGE_URI: ${{ steps.image-metadata.outputs.image_uri }}
        run: |
          set -euo pipefail

          docker push "$IMAGE_URI"

      - name: Verify image in Amazon ECR
        run: |
          set -euo pipefail

          aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --region "$AWS_REGION" \
            --image-ids imageTag="$IMAGE_TAG" \
            --query 'imageDetails[0].{
              Tag:imageTags[0],
              Digest:imageDigest,
              SizeBytes:imageSizeInBytes,
              PushedAt:imagePushedAt
            }' \
            --output table

      - name: Write ECR publication summary
        run: |
          {
            echo "## Immutable ECR Image"
            echo
            echo "- Repository: \`${ECR_REPOSITORY}\`"
            echo "- Tag: \`${IMAGE_TAG}\`"
            echo "- Authentication: GitHub OIDC"
            echo "- Static AWS keys: none"
            echo "- Security jobs completed before publication"
          } >> "$GITHUB_STEP_SUMMARY"
